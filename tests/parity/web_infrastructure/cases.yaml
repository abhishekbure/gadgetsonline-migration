# Parity cases for the web_infrastructure module (GOM-12): each case is one request, sent to the legacy
# application and to the new module, and the compared fields must be equal.
# Every page case compares the page title and the page's own content (not only the status).
# na: only where the platform cannot compare, or the legacy answer is a defect that is not reproduced; the reason is true.
schema_version: "1.0"

