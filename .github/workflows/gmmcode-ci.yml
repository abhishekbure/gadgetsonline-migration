name: GMMCODE CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: all

      - name: Restore dependencies
        run: dotnet restore ./.legacy-source/GadgetsOnline/GadgetsOnline.sln

      - name: Build solution
        run: dotnet build ./.legacy-source/GadgetsOnline/GadgetsOnline.sln --configuration Release --no-restore

      - name: Run tests with coverage
        run: dotnet test ./.legacy-source/GadgetsOnline/GadgetsOnline.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml
