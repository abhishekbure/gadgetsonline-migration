name: GMMCODE CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore dotnet-modernization-gadgetsonline/GadgetsOnline/GadgetsOnline.sln

      - name: Build solution
        run: dotnet build dotnet-modernization-gadgetsonline/GadgetsOnline/GadgetsOnline.sln --configuration Release --no-restore

      - name: Run tests with coverage
        run: dotnet test dotnet-modernization-gadgetsonline/GadgetsOnline/GadgetsOnline.sln --configuration Release --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Install ReportGenerator
        run: dotnet tool install --global reportgenerator

      - name: Generate Coverage Report
        shell: pwsh
        run: ./scripts/coverage/generate_coverage_report.ps1

      - name: Upload Coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage/**/coverage.cobertura.xml

      - name: Upload Coverage HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html-report
