services:
  gadgetsonline-legacy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    networks:
      - gadgetsonline-net
    healthcheck:
      test: ["CMD", "powershell", "-Command", "Invoke-WebRequest -Uri http://localhost/ -UseBasicParsing"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  gadgetsonline-net:
    driver: bridge
