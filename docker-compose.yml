services:
  gadgetsonline-legacy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./.legacy-source/GadgetsOnline/GadgetsOnline/:/inetpub/wwwroot
    networks:
      - gadgetsonline-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  gadgetsonline-net:
    driver: bridge
