services:
  gadgetsonline-legacy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    networks:
      - gadgetsonline-net
    healthcheck:
      test: ["CMD", "powershell", "-Command", "Invoke-WebRequest -Uri http://localhost/ -UseBasicParsing"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gadgetsonline-dev:
    image: mcr.microsoft.com/dotnet/sdk:6.0-windowsservercore-ltsc2019
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - gadgetsonline-net

networks:
  gadgetsonline-net:
    driver: bridge
